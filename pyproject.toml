[project]
name = "fastapi-template"
version = "0.1.0"
description = "Plantilla base de FastAPI lista para producción"
requires-python = ">=3.12,<3.16"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "gunicorn>=23,<24",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "httpx>=0.27,<1.0",
    "structlog>=24.4,<26.0",
    "orjson>=3.10,<4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<2.0",
    "pre-commit>=4.0,<5.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort (orden de imports)
    "B",     # flake8-bugbear (antipatrones y posibles bugs)
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade (sintaxis moderna de Python)
    "ASYNC", # flake8-async (detecta código bloqueante en funciones async)
    "S",     # flake8-bandit (seguridad básica)
    "T20",   # flake8-print (prohíbe usar print(), obliga a usar logger)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]